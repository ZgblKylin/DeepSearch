<html lang="zh-CN">

    <meta charset="UTF-8" />

    <meta
      name="description"
      content="DeepSearch：纯前端 DeepSeek 搜索与 AI 摘要。无广告、无追踪，API Key 仅保存在浏览器本地。"
    />

      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.deepseek.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"

      // 首屏前应用主题，避免深色模式闪白。
      ;(function () {
        var storageKey = 'deepsearch.settings.v1'
        var theme = 'system'
        try {
          var raw = window.localStorage.getItem(storageKey)
          if (raw) {
            var parsed = JSON.parse(raw)
            if (
              parsed &&
              (parsed.theme === 'light' || parsed.theme === 'dark' || parsed.theme === 'system')
            ) {
              theme = parsed.theme
            }
          }
        } catch (error) {
          theme = 'system'
        }
        var prefersDark =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        var resolved = theme === 'dark' || (theme === 'system' && prefersDark) ? 'dark' : 'light'
        document.documentElement.dataset.theme = resolved
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', resolved === 'dark' ? '#0f1115' : '#ffffff')
      })()
    </script>
